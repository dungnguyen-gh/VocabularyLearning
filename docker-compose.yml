version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vocab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vocab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: vocab-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vocab_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate dev && npm run seed && npm run dev"

volumes:
  postgres_data:
